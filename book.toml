[book]
title = "掌控一切：Better Ideas 生产力完全指南"
authors = ["Joe Hari / Better Ideas (原创)", "AI 整理与提炼"]
description = "基于 Better Ideas YouTube 频道 120 期视频（2017-2026）的深度整理。"
language = "zh"
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/syrangg813s7vi-web/betterideas-productivity-mastery"
git-repository-icon = "fa-github"
site-url = "/betterideas-productivity-mastery/"
no-section-label = false
fold.enable = true
fold.level = 1

[output.html.search]
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
copy-js = true

[output.html.print]
enable = true
page-break = true
